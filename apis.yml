aid: floqast
name: FloQast
description: >-
  FloQast is an accounting transformation platform that automates the financial
  close, reconciliations, and record-to-report workflows while preserving audit
  compliance and human sign-off. Built by accountants for accountants, it offers
  month-end close management, AI-driven transaction matching and reconciliation,
  journal entry management, variance analysis, consolidation, and Connected
  Compliance for evidence collection, risk management, and controls testing. Its
  Transform line adds no-code AI agents for accounting workflows where every
  output is explainable and every decision logged. FloQast connects to ERPs
  including Workday, Oracle NetSuite, SAP, Sage Intacct, Xero, and QuickBooks,
  and serves 3,500+ companies. It is an early ISO 42001 adopter with SOC 2 Type
  II, ISO 27001, and ISO 27701 certifications. FloQast does not publish a public
  developer API; this profile catalogs its identity, integration, security, and
  compliance surface.
